name: Build RootHide deb

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            fakeroot \
            rsync \
            curl \
            perl \
            zip \
            git \
            libxml2

      - name: Install RootHide Theos
        env:
          THEOS: /home/runner/theos
        run: |
          set -euxo pipefail

          rm -rf "$THEOS"

          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"

      - name: Verify Theos
        env:
          THEOS: /home/runner/theos
        run: |
          set -euxo pipefail

          echo "THEOS=$THEOS"

          command -v make
          make --version

          test -f "$THEOS/makefiles/common.mk"

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          echo "=== Toolchain ==="
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

          echo "=== SDKs ==="
          ls -la "$THEOS/sdks"

          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "*.sdk" \
            -print

      - name: Build package
        env:
          THEOS: /home/runner/theos
          THEOS_PACKAGE_SCHEME: roothide
        run: |
          set -euxo pipefail

          make clean
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardRounded-deb
          path: packages/*.deb
          if-no-files-found: error
